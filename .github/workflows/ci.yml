name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build + validate (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: |
          set -e
          for f in scripts/*.js; do
            node --check "$f"
            echo "ok  $f"
          done
          python3 -m py_compile scripts/*.py examples/gato-luna/make_fixture.py
          echo "ok  python scripts"

      # Runs before the build on purpose: it catches the authoring mistakes
      # (answer missing from its own word bank, a Cyrillic letter pasted among
      # Latin ones, a page sentence that disagrees with the page text) that
      # validate.js and the smoke tests cannot see.
      - name: Audit the content
        run: python3 scripts/audit_content.py examples/gato-luna

      - name: Build the bundled example (silent — no edge-tts in CI)
        run: node scripts/build.js --no-audio examples/gato-luna/content.json examples/gato-luna/worksheet.json examples/gato-luna/out

      - name: Validate
        run: node scripts/validate.js examples/gato-luna/out

      - name: Generate the course-library index
        run: python3 scripts/make_index.py examples

      - name: Every library link must resolve, and every lesson must link back
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("examples")
          index = root / "index.html"
          assert index.exists(), "make_index.py did not write examples/index.html"
          links = re.findall(r'href="([^"]+)"', index.read_text(encoding="utf-8"))
          assert links, "the index page has no lesson links"
          missing = [l for l in links if not (root / l).exists()]
          if missing:
              sys.exit(f"::error::broken library links: {missing}")
          print(f"ok  {len(links)} library link(s) resolve")

          # The back-to-library button is rendered from meta.indexHref at runtime,
          # so what the build must guarantee is that the value is embedded intact.
          # (The browser smoke job below asserts the button actually appears.)
          for page in sorted((root / "gato-luna" / "out").glob("*.html")):
              html = page.read_text(encoding="utf-8")
              if not re.search(r'"indexHref"\s*:\s*"\.\./\.\./index\.html"', html):
                  sys.exit(f"::error::{page.name} does not embed meta.indexHref")
              print(f"ok  {page.name} embeds the back-to-library target")
          PY

      - name: The example must still match its generator
        run: |
          python3 examples/gato-luna/make_fixture.py
          git diff --exit-code -- examples/gato-luna/content.json \
            || { echo "::error::examples/gato-luna/content.json is out of date — rerun make_fixture.py and commit it"; exit 1; }

  smoke:
    name: browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Built into the example's own out/ so the back-to-library link resolves
      # exactly the way it does for a real library (<library>/<lesson>/out/).
      - name: Build the bundled example (silent)
        run: node scripts/build.js --no-audio examples/gato-luna/content.json examples/gato-luna/worksheet.json examples/gato-luna/out

      - name: Generate the course-library index
        run: python3 scripts/make_index.py examples

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Install puppeteer-core
        run: npm install --no-save puppeteer-core

      - name: Smoke-test the lesson
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          SMOKE_ALLOW_SILENT: '1'
        run: node scripts/smoke_lesson.js examples/gato-luna/out/gato-luna_Lectura_Lesson.html /tmp/shot.png

      - name: Smoke-test the worksheet and answer key
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/smoke_worksheet.js examples/gato-luna/out/gato-luna_Cuaderno_Worksheet.html /tmp/ak

      - name: Keep the screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            /tmp/shot.png
            /tmp/ak_expanded.png
            /tmp/ak_folded.png
          if-no-files-found: ignore
          retention-days: 7
